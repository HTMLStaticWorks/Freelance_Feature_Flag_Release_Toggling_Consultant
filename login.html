<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FlagMasters Release Orchestrator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6D5EF3',
                        secondary: '#0F172A',
                        accent: '#6D5EF3',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <main class="min-h-screen relative flex items-center justify-center py-20 overflow-hidden bg-slate-950">
        <!-- Abstract Background Elements -->
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/20 rounded-full blur-[120px] animate-pulse"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-accent/20 rounded-full blur-[120px] animate-pulse delay-700"></div>

        <!-- Utilities (Theme/RTL) -->
        <div class="absolute top-8 right-8 flex items-center space-x-4 z-50">
            <button class="theme-toggle w-10 h-10 glass-card rounded-xl flex items-center justify-center hover:bg-primary/10 transition-all border border-slate-200 dark:border-slate-800" title="Toggle Theme">
                <i data-lucide="sun" class="w-5 h-5 dark:hidden text-primary"></i>
                <i data-lucide="moon" class="w-5 h-5 hidden dark:block text-primary"></i>
            </button>
            <button class="rtl-toggle w-10 h-10 glass-card rounded-xl flex items-center justify-center hover:bg-primary/10 transition-all border border-slate-200 dark:border-slate-800" title="Toggle RTL">
                <i data-lucide="languages" class="w-5 h-5 text-primary"></i>
            </button>
        </div>

        <!-- Login Card -->
        <div class="w-full max-w-md reveal">
            <div class="glass-card p-8 md:p-12 rounded-[2.5rem] shadow-2xl relative overflow-hidden group">
                <!-- Card Inner Glow -->
                <div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700"></div>

                <div class="relative z-10">
                    <!-- Brand Identity -->
                    <a href="index.html" class="flex items-center justify-center space-x-2 mb-10 group/logo">
                        <div class="w-10 h-10 bg-gradient-to-br from-primary to-accent rounded-xl flex items-center justify-center shadow-lg shadow-primary/20 group-hover/logo:scale-110 transition-transform">
                            <i data-lucide="toggle-right" class="text-white w-6 h-6"></i>
                        </div>
                        <span class="text-2xl font-bold font-['Outfit'] tracking-tight">Flag<span class="text-primary">Masters</span></span>
                    </a>

                    <!-- Headings -->
                    <div class="text-center mb-10">
                        <h1 class="text-3xl font-bold mb-2">Welcome Back</h1>
                        <p class="text-slate-500 text-sm">Secure access to your release infrastructure</p>
                    </div>

                    <!-- Login Form -->
                    <form class="space-y-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Email Address</label>
                            <div class="relative">
                                <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                                <input type="email" placeholder="architect@flagmasters.io" class="w-full pl-12 pr-6 py-4 bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-slate-900 transition-all text-sm font-medium">
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Password</label>
                            <div class="relative group/pass">
                                <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 group-focus-within/pass:text-primary transition-colors"></i>
                                <input type="password" id="password" placeholder="••••••••••••" class="w-full pl-12 pr-12 py-4 bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-slate-900 transition-all text-sm font-medium">
                                <button type="button" id="password-toggle" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors focus:outline-none">
                                    <i data-lucide="eye" class="w-4 h-4" id="eye-icon"></i>
                                    <i data-lucide="eye-off" class="w-4 h-4 hidden" id="eye-off-icon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Horizontal Row: Remember Me & Forgot Password -->
                        <div class="flex items-center justify-between px-1">
                            <label class="flex items-center space-x-2 cursor-pointer group/check">
                                <div class="relative flex items-center justify-center">
                                    <input type="checkbox" class="peer appearance-none w-5 h-5 border-2 border-slate-200 dark:border-slate-800 rounded-lg checked:bg-primary checked:border-primary transition-all cursor-pointer">
                                    <i data-lucide="check" class="absolute w-3 h-3 text-white opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none"></i>
                                </div>
                                <span class="text-xs font-medium text-slate-500 group-hover/check:text-primary transition-colors">Remember Me</span>
                            </label>
                            <a href="#" class="text-xs font-bold text-primary hover:underline underline-offset-4">Forgot Password?</a>
                        </div>

                        <button class="w-full py-4 bg-primary text-white rounded-2xl font-bold text-sm hover:bg-primary/90 transition-all shadow-xl shadow-primary/20 hover:shadow-primary/40 active:scale-[0.98]">
                            Sign In to Dashboard
                        </button>
                    </form>

                    <!-- Divider -->
                    <div class="relative my-10">
                        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200 dark:border-slate-800"></div></div>
                        <div class="relative flex justify-center text-[10px] uppercase tracking-widest font-bold"><span class="px-4 bg-[#f8fafc] dark:bg-[#0F172A] text-slate-500">Or Continue With</span></div>
                    </div>

                    <!-- Social Logins -->
                    <div class="grid grid-cols-3 gap-4">
                        <button type="button" class="social-btn group/google" title="Google">
                            <svg class="w-5 h-5" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                        </button>
                        <button type="button" class="social-btn group/facebook" title="Facebook">
                            <svg class="w-5 h-5" viewBox="0 0 24 24">
                                <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                            </svg>
                        </button>
                        <button type="button" class="social-btn group/apple" title="Apple">
                            <svg class="w-5 h-5 fill-slate-900 dark:fill-white" viewBox="0 0 384 512">
                                <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
                            </svg>
                        </button>
                    </div>

                    <p class="mt-10 text-center text-sm text-slate-500 font-medium">
                        New to FlagMasters? <a href="signup.html" class="text-primary font-bold hover:underline">Create Account</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // Password Toggle Logic
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.getElementById('password-toggle');
            const eyeIcon = document.getElementById('eye-icon');
            const eyeOffIcon = document.getElementById('eye-off-icon');

            if (passwordToggle && passwordInput) {
                passwordToggle.addEventListener('click', () => {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    
                    // Toggle Icons
                    eyeIcon.classList.toggle('hidden');
                    eyeOffIcon.classList.toggle('hidden');
                });
            }
        });
    </script>
</body>
</html>
