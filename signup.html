<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | FlagMasters Release Orchestrator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6D5EF3',
                        secondary: '#0F172A',
                        accent: '#6D5EF3',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <main class="min-h-screen relative flex items-center justify-center py-20 overflow-hidden bg-slate-50 dark:bg-slate-950">
        <!-- Abstract Background Elements -->
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/20 rounded-full blur-[120px] animate-pulse"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-accent/20 rounded-full blur-[120px] animate-pulse delay-700"></div>

        <!-- Utilities (Theme/RTL) -->
        <div class="absolute top-8 right-8 flex items-center space-x-4 z-50">
            <button class="theme-toggle w-10 h-10 glass-card rounded-xl flex items-center justify-center hover:bg-primary/10 transition-all border border-slate-200 dark:border-slate-800" title="Toggle Theme">
                <i data-lucide="sun" class="w-5 h-5 dark:hidden text-primary"></i>
                <i data-lucide="moon" class="w-5 h-5 hidden dark:block text-primary"></i>
            </button>
            <button class="rtl-toggle w-10 h-10 glass-card rounded-xl flex items-center justify-center hover:bg-primary/10 transition-all border border-slate-200 dark:border-slate-800" title="Toggle RTL">
                <i data-lucide="languages" class="w-5 h-5 text-primary"></i>
            </button>
        </div>

        <!-- Signup Card -->
        <div class="w-full max-w-md reveal">
            <div class="glass-card p-8 md:p-12 rounded-[2.5rem] shadow-2xl relative overflow-hidden group">
                <!-- Card Inner Glow -->
                <div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700"></div>

                <div class="relative z-10">
                    <!-- Brand Identity -->
                    <a href="index.html" class="flex items-center justify-center space-x-2 mb-10 group/logo">
                        <div class="w-10 h-10 bg-gradient-to-br from-primary to-accent rounded-xl flex items-center justify-center shadow-lg shadow-primary/20 group-hover/logo:scale-110 transition-transform">
                            <i data-lucide="toggle-right" class="text-white w-6 h-6"></i>
                        </div>
                        <span class="text-2xl font-bold font-['Outfit'] tracking-tight">Flag<span class="text-primary">Masters</span></span>
                    </a>

                    <!-- Headings -->
                    <div class="text-center mb-8">
                        <h1 class="text-3xl font-bold mb-2">Create Account</h1>
                        <p class="text-slate-500 text-sm">Join the enterprise release orchestrator</p>
                    </div>

                    <!-- Signup Form -->
                    <form class="space-y-5">
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ms-1">Full Name</label>
                            <div class="relative">
                                <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                                <input type="text" placeholder="John Architect" class="w-full ps-12 pe-6 py-3.5 bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-slate-900 transition-all text-sm font-medium">
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ms-1">Work Email</label>
                            <div class="relative">
                                <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                                <input type="email" placeholder="john@company.io" class="w-full ps-12 pe-6 py-3.5 bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-slate-900 transition-all text-sm font-medium">
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ms-1">Password</label>
                            <div class="relative group/pass">
                                <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 group-focus-within/pass:text-primary transition-colors"></i>
                                <input type="password" id="password" placeholder="••••••••••••" class="w-full ps-12 pe-12 py-3.5 bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-slate-900 transition-all text-sm font-medium">
                                <button type="button" id="password-toggle" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors focus:outline-none">
                                    <i data-lucide="eye" class="w-4 h-4" id="eye-icon"></i>
                                    <i data-lucide="eye-off" class="w-4 h-4 hidden" id="eye-off-icon"></i>
                                </button>
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ms-1">Confirm Password</label>
                            <div class="relative group/confirm">
                                <i data-lucide="shield-check" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 group-focus-within/confirm:text-primary transition-colors"></i>
                                <input type="password" id="confirm-password" placeholder="••••••••••••" class="w-full ps-12 pe-12 py-3.5 bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-slate-900 transition-all text-sm font-medium">
                                <button type="button" id="confirm-password-toggle" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors focus:outline-none">
                                    <i data-lucide="eye" class="w-4 h-4" id="confirm-eye-icon"></i>
                                    <i data-lucide="eye-off" class="w-4 h-4 hidden" id="confirm-eye-off-icon"></i>
                                </button>
                            </div>
                        </div>

                        <div class="pt-4">
                            <button class="w-full py-4 bg-primary text-white rounded-2xl font-bold text-sm hover:bg-primary/90 transition-all shadow-xl shadow-primary/20 hover:shadow-primary/40 active:scale-[0.98]">
                                Create Enterprise Account
                            </button>
                        </div>
                    </form>

                    <!-- Divider -->
                    <div class="relative my-10 flex justify-center text-[10px] uppercase tracking-[0.25em] font-bold text-slate-400 dark:text-slate-600">
                        Or Sign Up With
                    </div>

                    <!-- Social Signups -->
                    <div class="grid grid-cols-3 gap-4">
                        <button type="button" class="social-btn group/google" title="Google">
                            <svg class="w-6 h-6" viewBox="0 0 48 48">
                                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                                <path fill="none" d="M0 0h48v48H0z"/>
                            </svg>
                        </button>
                        <button type="button" class="social-btn group/facebook" title="Facebook">
                            <svg class="w-6 h-6" viewBox="0 0 24 24">
                                <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                            </svg>
                        </button>
                        <button type="button" class="social-btn group/apple" title="Apple">
                            <svg class="w-6 h-6 fill-slate-900 dark:fill-white" viewBox="0 0 384 512">
                                <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
                            </svg>
                        </button>
                    </div>

                    <p class="mt-10 text-center text-sm text-slate-500 font-medium">
                        Already have an account? <a href="login.html" class="text-primary font-bold hover:underline">Log In</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // Function to setup password toggle
            const setupToggle = (inputId, toggleId, eyeId, eyeOffId) => {
                const input = document.getElementById(inputId);
                const toggle = document.getElementById(toggleId);
                const eye = document.getElementById(eyeId);
                const eyeOff = document.getElementById(eyeOffId);

                if (toggle && input) {
                    toggle.addEventListener('click', () => {
                        const isPassword = input.type === 'password';
                        input.type = isPassword ? 'text' : 'password';
                        eye.classList.toggle('hidden');
                        eyeOff.classList.toggle('hidden');
                    });
                }
            };

            setupToggle('password', 'password-toggle', 'eye-icon', 'eye-off-icon');
            setupToggle('confirm-password', 'confirm-password-toggle', 'confirm-eye-icon', 'confirm-eye-off-icon');
        });
    </script>
</body>
</html>
